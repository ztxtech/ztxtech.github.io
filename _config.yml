# Site Settings
title: "Tianxiang Zhan"
description: "Explore the secrets of time."
repository: "ztxtech/ztxtech.github.io"
url: "https://ztxtech.github.io" # canonical host: used by meta tags, JSON-LD and sitemap.xml
baseurl: ""
google_scholar_stats_use_cdn: true

# google analytics
google_analytics_id: "G-WE2J7LBCGB"

# SEO Related
google_site_verification: # get google_site_verification from https://search.google.com/search-console/about
bing_site_verification: # get bing_site_verification from https://www.bing.com/webmasters/about
