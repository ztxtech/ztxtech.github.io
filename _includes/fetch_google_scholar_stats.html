<script>
  (function () {
    "use strict";

    {% if site.google_scholar_stats_use_cdn %}
    var baseUrl = "https://cdn.jsdelivr.net/gh/{{ site.repository }}@";
    {% else %}
    var baseUrl = "https://raw.githubusercontent.com/{{ site.repository }}/";
    {% endif %}

    fetch(baseUrl + "google-scholar-stats/gs_data.json")
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Unable to load citation data");
        }
        return response.json();
      })
      .then(function (data) {
        var totalCitations = document.getElementById("total_cit");
        if (totalCitations) {
          totalCitations.textContent = data.citedby;
        }

        document.querySelectorAll(".show_paper_citations").forEach(function (element) {
          var paper = data.publications[element.getAttribute("data")];
          if (paper) {
            element.textContent = "| Citations: " + paper.num_citations;
          }
        });
      })
      .catch(function () {
        /* Citation counts are supplemental; the page remains usable without them. */
      });
  })();
</script>
