<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="masthead__brand" href="{{ '/' | relative_url }}" aria-label="ztxtech home">
      <img
        src="{{ '/images/brand/ztxtech-logo.png' | relative_url }}"
        alt="ztxtech"
        width="150"
        height="32"
      >
    </a>

    <button
      class="masthead__toggle"
      type="button"
      aria-controls="site-nav"
      aria-expanded="false"
      aria-label="Open navigation"
    >
      <svg class="lucide lucide-menu" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <nav id="site-nav" class="masthead__nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">Homepage</a>
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
